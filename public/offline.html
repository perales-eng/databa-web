<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión — datABA</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#f9fafb;color:#0f172a;padding:24px}
    .card{max-width:420px;text-align:center}
    .icon{width:72px;height:72px;margin:0 auto 16px;background:#0F766E;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:32px}
    h1{font-size:22px;margin:0 0 8px}
    p{color:#64748b;line-height:1.5;margin:0 0 20px;font-size:15px}
    button{padding:10px 18px;background:#0f172a;color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
    button:hover{opacity:.9}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">d</div>
    <h1>Sin conexión</h1>
    <p>No pudimos cargar esta página porque no hay internet. Reconectate y volvé a intentar — los datos que ya guardaste están a salvo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
