name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (sin DB en runtime — skip migrate deploy en CI)
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          AUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
          AUTH_URL: "http://localhost:3000"
        # En CI el contenedor no tiene una BD real para migrar, así que
        # corremos sólo el build sin el "prisma migrate deploy" del script.
        run: npx next build
